<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kurdish TV</title>
<style>
  /* Laid out for a 1920x1080 TV: 1rem is 10px at that width, whatever the WebView's real size. */
  :root { --bg:#07080c; --text:#f3f4f7; --muted:#9097a6; --accent:#f6b819; --red:#e3262b; --ease:cubic-bezier(.2,.8,.2,1); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { font-size:calc(100vw / 192); background:var(--bg); }
  body { width:100vw; height:100vh; overflow:hidden; color:var(--text);
    font-family:Roboto, "Segoe UI", system-ui, sans-serif; }
  #guide { position:absolute; inset:0; transition:opacity .3s var(--ease), visibility .3s;
    background:radial-gradient(90rem 60rem at 0% 0%, rgba(227,38,43,.13), transparent 70%),
               radial-gradient(90rem 60rem at 100% 100%, rgba(33,160,80,.12), transparent 70%), var(--bg); }
  html.watching { background:transparent; }
  html.watching #guide { opacity:0; visibility:hidden; }

  /* Only transform and opacity animate, because the TV's GPU does those without repainting. The focus ring's shadow
     is drawn once, on a pseudo-element that fades in. */
  .enter { animation:enter .32s var(--ease); }
  @keyframes enter { from { opacity:0; transform:translateY(1.2rem) scale(.99); } }
  .tile::after, .card::after { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; opacity:0;
    transition:opacity .2s var(--ease); }
  .tile::after { box-shadow:0 0 0 .5rem var(--accent), 0 2.4rem 6rem rgba(0,0,0,.6); }
  .card::after { box-shadow:0 0 0 .45rem var(--accent), 0 2rem 5rem rgba(0,0,0,.65); }
  .tile.focus::after, .card.focus::after { opacity:1; }
  [hidden] { display:none !important; }

  header { position:absolute; left:8rem; right:8rem; top:4.6rem; height:7rem; display:flex; align-items:center; gap:3rem; }
  .brand { display:flex; align-items:center; gap:1.4rem; font-size:3.2rem; font-weight:800; }
  .brand svg { width:5.6rem; height:5.6rem; }
  #crumb { font-size:3.2rem; font-weight:300; color:var(--muted); }
  #clock { margin-left:auto; font-size:2.8rem; font-weight:500; color:#c9cdd6; }

  /* home: the categories you go into */
  #home { position:absolute; left:8rem; right:8rem; top:15rem; bottom:0; }
  .langs { display:grid; grid-template-columns:repeat(3, 1fr); gap:2.4rem; height:34rem; }
  .topics { display:grid; grid-template-columns:repeat(7, 1fr); gap:2.4rem; height:19rem; margin-top:2.6rem; }
  .tile { position:relative; border-radius:2.4rem; padding:3.2rem; transition:transform .24s var(--ease); will-change:transform; }
  .tile.focus { transform:scale(1.04); z-index:2; }
  .clip { position:absolute; inset:0; overflow:hidden; border-radius:inherit; }
  .lang h1 { position:relative; font-size:6.6rem; font-weight:800; letter-spacing:-.01em; }
  .lang .nat { position:relative; font-size:3.6rem; font-weight:600; opacity:.85; margin-top:.2rem; min-height:4.6rem; }
  .cnt { position:relative; font-size:2.1rem; color:rgba(255,255,255,.8); margin-top:.8rem; }
  .minis { position:absolute; left:3.2rem; bottom:3.2rem; display:flex; gap:1.2rem; }
  .minis span { width:10rem; height:5.8rem; border-radius:1.2rem; background:rgba(0,0,0,.32); display:grid; place-items:center; }
  .minis img { max-width:8rem; max-height:4rem; object-fit:contain; }
  .deco { position:absolute; right:-5rem; top:-5rem; width:36rem; height:36rem; opacity:.3; }
  .deco.txt { right:3rem; top:1.6rem; width:auto; height:auto; font-size:20rem; font-weight:900; line-height:1; color:#fff; opacity:.13; }
  .lang.ku { background:linear-gradient(135deg, #c3191f 0%, #8f1217 40%, #0f5f2e 100%); }
  .lang.ar { background:linear-gradient(135deg, #12786b 0%, #0a443d 55%, #1a2a20 100%); }
  .lang.en { background:linear-gradient(135deg, #2a52c0 0%, #142e78 55%, #0d1838 100%); }
  .topic { display:flex; flex-direction:column; justify-content:flex-end; }
  .topic svg { position:absolute; top:2.8rem; left:3rem; width:6.4rem; height:6.4rem; fill:none; stroke:#fff; stroke-width:1.8;
    stroke-linecap:round; stroke-linejoin:round; }
  .topic h3 { position:relative; font-size:3.3rem; font-weight:800; }
  .topic .cnt { margin-top:.4rem; font-size:1.9rem; }
  .recent { margin-top:3.6rem; }
  .recent h2, #gtrack h2 { font-size:2.5rem; font-weight:700; color:#dfe2e8; }
  .recent h2 { margin-bottom:1.6rem; }
  .recent .strip { display:grid; grid-template-columns:repeat(6, 1fr); gap:2.4rem; }
  .recent .card { height:14.6rem; }
  .recent .card img { max-height:7.6rem; }

  /* a category: its channels in a grid, in sections */
  #grid { position:absolute; left:8rem; right:8rem; top:14rem; bottom:0; }
  .gtitle { display:flex; align-items:baseline; gap:2rem; height:8rem; }
  .gtitle h1 { font-size:5.8rem; font-weight:800; }
  .gtitle span { font-size:2.4rem; color:var(--muted); }
  .gtitle .back { margin-left:auto; font-size:2.2rem; color:var(--text); background:rgba(255,255,255,.08); padding:1rem 2.4rem;
    border-radius:99rem; cursor:pointer; }
  .tile, .card, .item { cursor:pointer; }
  #gview { position:absolute; top:9rem; left:-2rem; right:-2rem; bottom:0; overflow:hidden; padding:1.2rem 2rem 0; }
  #gtrack { transition:transform .34s var(--ease); will-change:transform; }
  #gtrack h2 { height:5.4rem; padding-top:.4rem; }
  #gtrack h2 span, .recent h2 span { color:var(--muted); font-weight:400; font-size:2rem; margin-left:1.2rem; }
  .gline { display:grid; grid-template-columns:repeat(6, 1fr); gap:2.4rem; height:19.6rem; }

  .card { height:17rem; border-radius:2rem; position:relative; display:grid; place-items:center;
    background:linear-gradient(160deg, #262a35, #171a22); border:.1rem solid rgba(255,255,255,.07); transition:transform .24s var(--ease), opacity .2s var(--ease); }
  .card .lg { height:58%; width:76%; display:grid; place-items:center; margin-bottom:3.2rem; }
  .card img { max-width:100%; max-height:9.4rem; object-fit:contain; }
  .card .ini { display:none; font-size:4rem; font-weight:800; color:#e6e8ee; text-align:center; }
  .card.noimg .ini { display:block; }
  .card.noimg img { display:none; }
  .card .name { position:absolute; bottom:1.4rem; left:1.6rem; right:1.6rem; text-align:center; font-size:1.9rem; font-weight:500;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#d6d9e0; }
  .card .num { position:absolute; top:1.2rem; left:1.4rem; font-size:1.5rem; font-weight:700; color:var(--muted); }
  .card.app { background:linear-gradient(160deg, #3a2e10, #1a160c); border-color:rgba(246,184,25,.45); }
  .card.app .ini { font-size:3.2rem; color:var(--accent); }
  .card.off { opacity:.45; }
  .card.focus { transform:scale(1.08); z-index:2; opacity:1; }
  .removing .card:not(.app)::after { box-shadow:0 0 0 .45rem var(--red), 0 2rem 5rem rgba(0,0,0,.65); }

  /* watching */
  #osd { position:absolute; left:0; right:0; bottom:0; padding:12rem 8rem 6rem; display:flex; align-items:center; gap:3rem;
    background:linear-gradient(transparent, rgba(0,0,0,.88)); opacity:0; transform:translateY(2rem);
    transition:opacity .3s var(--ease), transform .3s var(--ease); }
  #osd.show { opacity:1; transform:none; }
  #osd .n { font-size:5.2rem; font-weight:800; color:var(--accent); min-width:10rem; }
  #osd .plate { width:22rem; height:12.4rem; border-radius:1.6rem; background:rgba(255,255,255,.08); display:grid; place-items:center; flex:none; }
  #osd .plate img { max-width:17rem; max-height:8rem; object-fit:contain; }
  #osd .plate b { font-size:4rem; }
  #osd h3 { font-size:4.8rem; font-weight:800; }
  .meta { margin-top:1.2rem; font-size:2.2rem; color:#c3c7d0; display:flex; gap:1.4rem; align-items:center; }
  .live { background:var(--red); color:#fff; font-size:1.5rem; font-weight:800; letter-spacing:.1em; padding:.45rem 1rem; border-radius:.6rem; }
  #osd .keys { margin-left:auto; text-align:right; font-size:1.9rem; color:#aab0bc; line-height:1.8; }

  #status { position:absolute; inset:0; display:none; place-items:center; text-align:center; }
  #status.show { display:grid; }
  #status .box { background:rgba(8,9,12,.75); padding:4rem 6rem; border-radius:2.4rem; animation:enter .25s var(--ease); }
  .spin { width:7rem; height:7rem; border-radius:50%; border:.7rem solid rgba(255,255,255,.18); border-top-color:var(--accent);
    margin:0 auto 2.4rem; animation:spin .9s linear infinite; }
  #status.err .spin { display:none; }
  #status p { font-size:2.7rem; font-weight:600; }
  #status small { display:block; margin-top:1.2rem; font-size:2rem; font-weight:400; color:#b9bec8; }
  @keyframes spin { to { transform:rotate(360deg); } }

  #list { position:absolute; top:0; bottom:0; left:0; width:62rem; padding:6rem 0 0 6rem; overflow:hidden;
    background:linear-gradient(90deg, rgba(6,7,10,.96) 75%, rgba(6,7,10,0)); transform:translateX(-64rem); transition:transform .3s var(--ease); will-change:transform; }
  #list.show { transform:none; }
  #list h4 { font-size:2.8rem; font-weight:800; color:var(--accent); margin-bottom:2.4rem; }
  #items { transition:transform .28s var(--ease); will-change:transform; }
  .item { display:flex; align-items:center; gap:2rem; height:8.4rem; margin:0 8rem .6rem 0; padding:0 2rem; border-radius:1.4rem; transition:background-color .18s, color .18s; }
  .item .n { width:5.6rem; font-size:2rem; font-weight:700; color:var(--muted); }
  .item .lg { width:10rem; height:5.6rem; display:grid; place-items:center; flex:none; }
  .item img { max-width:10rem; max-height:5.6rem; object-fit:contain; }
  .item .t { font-size:2.4rem; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item.cur .t::after { content:""; display:inline-block; width:1.2rem; height:1.2rem; border-radius:50%; background:var(--red); margin-left:1.2rem; vertical-align:middle; }
  .item.focus { background:var(--text); color:#0b0c10; }
  .item.focus .n { color:#4a4f5a; }

  #toast { position:absolute; left:50%; bottom:6rem; transform:translate(-50%, 1.5rem); background:rgba(20,22,28,.95); padding:2rem 4rem;
    border-radius:99rem; font-size:2.2rem; opacity:0; transition:opacity .3s var(--ease), transform .3s var(--ease); }
  #toast.show { opacity:1; transform:translate(-50%, 0); }
</style>
</head>
<body>
  <div id="guide">
    <header>
      <div class="brand"><svg id="sun" viewBox="-50 -50 100 100"></svg>Kurdish TV</div>
      <div id="crumb"></div>
      <div id="clock"></div>
    </header>
    <main id="home"></main>
    <main id="grid" hidden></main>
  </div>
  <div id="osd"></div>
  <div id="status"><div class="box"><div class="spin"></div><p></p></div></div>
  <div id="list"></div>
  <div id="toast"></div>
  <script src="channels.js"></script>
  <script src="logos.js"></script>
  <script src="app.js"></script>
</body>
</html>
