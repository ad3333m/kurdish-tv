name: Kurdish TV APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Keeping the debug keystore between runs means an update installs over the previous one.
      - name: Reuse the signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kurdish-tv-debug-keystore-v1

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build the APK
        run: gradle :app:assembleRelease

      - name: Name it
        run: |
          set -eu
          mkdir -p out
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          test -n "$APK" || { echo "no apk"; exit 1; }
          cp "$APK" out/KurdishTV.apk
          du -h out/KurdishTV.apk

      # The account's Actions artifact storage is full, so builds go to a release.
      - name: Publish to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Kurdish TV" --notes "Latest build for Google TV (BRAVIA). Install KurdishTV.apk."
          gh release upload latest out/KurdishTV.apk --clobber

  tv-emulator:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: mkdir -p out && gh release download latest -p KurdishTV.apk -D out --clobber
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on an Android TV emulator with the remote
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: android-tv
          arch: x86
          profile: tv_1080p
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: false
          script: bash tools/emulator_test.sh
      - name: Publish the screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls tv-shots || exit 0
          gh release view preview >/dev/null 2>&1 || gh release create preview --prerelease --title "Emulator screenshots" --notes "From the last CI run on an Android TV emulator."
          gh release upload preview tv-shots/* --clobber
